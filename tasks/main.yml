---
- name: Determine if dotmodules_repo is a local path
  set_fact:
    dotmodules_repo_local: "{{ dotmodules_repo is match('^(file://|/).*') }}"

- name: Remove file:// prefix if present
  set_fact:
    dotmodules_repo_path: "{{ dotmodules_repo | regex_replace('^file://', '') }}"
  when: dotmodules_repo_local

- name: Clone or update dotmodules repository (remote)
  ansible.builtin.git:
    repo: "{{ dotmodules_repo }}"
    dest: "{{ dotmodules_dest }}"
    version: "main"
    force: yes
  when: not dotmodules_repo_local

- name: Link dotmodules folder (for testing)
  ansible.builtin.file:
    src: "{{ dotmodules_repo_path }}"
    dest: "{{ dotmodules_dest }}"
    state: link
  when: dotmodules_repo_local

# Initialize aggregated configurations
- name: Initialize aggregated module configurations
  ansible.builtin.set_fact:
    stow_dirs: []
    collected_configs: {}

- name: Process each dotmodule in the install list
  ansible.builtin.include_tasks: process_module.yml
  loop: "{{ dotmodules_install }}"
  loop_control:
    loop_var: module_name

# Convert collected_configs to a list of key-value pairs
- name: Convert collected configurations to key-value pairs
  ansible.builtin.set_fact:
    collected_items: >-
      {{
        collected_configs | dict2items
        | map(attribute='value') | list
        | map('dict2items') | sum(start=[])
      }}

# Deduplicate list-based values and detect conflicts for scalar values
- name: Reduce collected configurations
  ansible.builtin.set_fact:
    final_config: >-
      {{
        final_config | default({}) | combine({
          item.key: (
            ((final_config | default({}))[item.key] | default([]) + item.value) | flatten | unique
            if item.value is iterable and item.value is not string and item.value is not mapping
            else item.value
          )
        }, recursive=True)
      }}
  loop: "{{ collected_items }}"

# Fail if there are conflicting scalar values
- name: Detect conflicts in scalar values
  ansible.builtin.fail:
    msg: "Conflicting values detected for key(s): {{ ansible_failed_task }}"
  when: ansible_failed_task is defined and ansible_failed_task | length > 0

- name: Debug final_config contents
  ansible.builtin.debug:
    var: ansible_facts

# Set reasonable defaults
- name: Override geerling.mac defaults
  ansible.builtin.set_fact:
    homebrew_taps: []
    mas_installed_apps: []

# Promote each variable from the combined config into a host variable
- name: Set combined facts
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ final_config | dict2items }}"

# Resolve file strategy conflicts first
- name: Resolve file strategy conflicts
  ansible.builtin.include_tasks: conflict_resolution.yml
  when: dotmodules_install | length > 0

# Filter out modules that have mergeable files to prevent conflicts
- name: Create list of modules with mergeable files
  ansible.builtin.set_fact:
    modules_with_mergeable_files: "{{ modules_with_mergeable_files | default([]) + [item] }}"
  loop: "{{ dotmodules_install }}"
  when: >
    item in collected_configs
    and collected_configs[item].mergeable_files is defined
    and collected_configs[item].mergeable_files | length > 0

- name: Debug filtering results
  ansible.builtin.debug:
    msg: |
      Filtering results:
      - Original stow_dirs: {{ stow_dirs }}
      - Modules with mergeable files: {{ modules_with_mergeable_files }}
      - Collected configs keys: {{ collected_configs.keys() | list }}

- name: Filter stow directories to exclude modules with mergeable files
  ansible.builtin.set_fact:
    stow_dirs_filtered: "{{ stow_dirs | difference(modules_with_mergeable_files) }}"

- name: Debug final filtering results
  ansible.builtin.debug:
    msg: |
      Final filtering results:
      - Filtered stow_dirs: {{ stow_dirs_filtered }}

# Pre-create shared parent directories to prevent stow ownership conflicts
- name: Find all directories in module files subdirectories
  ansible.builtin.find:
    paths: "{{ dotmodules_dest }}/{{ item }}/files"
    recurse: yes
    file_type: directory
  register: module_dirs
  loop: "{{ stow_dirs_filtered }}"
  when: stow_dirs_filtered | length > 0

- name: Collect unique parent directory paths
  ansible.builtin.set_fact:
    parent_dirs: >-
      {{
        module_dirs.results
        | selectattr('files', 'defined')
        | map(attribute='files')
        | flatten
        | map(attribute='path')
        | map('regex_replace', '^' + (dotmodules_dest | regex_escape) + '/[^/]+/files/?', '')
        | select('string')
        | reject('equalto', '')
        | unique
        | sort
      }}
  when: stow_dirs_filtered | length > 0

- name: Pre-create parent directories in HOME
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ parent_dirs | default([]) }}"
  when: parent_dirs is defined and parent_dirs | length > 0

# Remove old stow tree-fold symlinks that point into module source directories.
# These cause ansible's file module to follow through and corrupt source files.
- name: Check for tree-fold symlinks in HOME from old stow runs
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/{{ item }}"
  register: home_path_stats
  loop: "{{ parent_dirs | default([]) }}"
  when: parent_dirs is defined and parent_dirs | length > 0

- name: Remove tree-fold symlinks and replace with real directories
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item.item }}"
    state: absent
  loop: "{{ home_path_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - home_path_stats.results is defined
    - item.stat is defined
    - item.stat.islnk is defined
    - item.stat.islnk

- name: Recreate directories after removing tree-fold symlinks
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item.item }}"
    state: directory
    mode: '0755'
  loop: "{{ home_path_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - home_path_stats.results is defined
    - item.stat is defined
    - item.stat.islnk is defined
    - item.stat.islnk

- name: Find all files in module files directories
  ansible.builtin.find:
    paths: "{{ dotmodules_dest }}/{{ item }}/files"
    recurse: yes
    file_type: file
    hidden: yes
  register: module_files
  loop: "{{ stow_dirs_filtered }}"
  when: stow_dirs_filtered | length > 0

- name: Build symlink map from module files
  ansible.builtin.set_fact:
    symlink_map: >-
      {{
        module_files.results
        | selectattr('files', 'defined')
        | map(attribute='files')
        | flatten
        | map(attribute='path')
        | map('regex_replace',
            '^' + (dotmodules_dest | regex_escape) + '/[^/]+/files/(.+)$',
            '\1')
        | list
      }}
    symlink_sources: >-
      {{
        module_files.results
        | selectattr('files', 'defined')
        | map(attribute='files')
        | flatten
        | map(attribute='path')
        | list
      }}
  when: stow_dirs_filtered | length > 0

- name: Create dotfile symlinks in HOME
  ansible.builtin.file:
    src: "{{ item.0 }}"
    dest: "{{ ansible_env.HOME }}/{{ item.1 }}"
    state: link
    force: yes
    follow: no
  loop: "{{ symlink_sources | zip(symlink_map) | list }}"
  loop_control:
    label: "{{ item.1 }}"
  when: symlink_map is defined and symlink_map | length > 0

# Handle mergeable files (after individual symlinks so a stow failure doesn't block them)
- name: Process mergeable files
  ansible.builtin.include_tasks: merge_files.yml
  when: dotmodules_install | length > 0

# Install git repositories (before Homebrew to ensure dependencies are available)
- name: Ensure configured git repositories are installed
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest | expanduser }}"
    version: "{{ item.version | default('master') }}"
    update: "{{ item.update | default(true) | bool }}"
    force: "{{ item.force | default(false) | bool }}"
    recursive: "{{ item.recursive | default(true) | bool }}"
  loop: "{{ git_repositories | default([]) }}"
  when: git_repositories is defined and git_repositories | length > 0
  loop_control:
    label: "{{ item.repo }} -> {{ item.dest }}"

# Run Homebrew installation once for all modules
- name: Run Mac App Store installation for all modules using the collection
  ansible.builtin.include_role:
    name: "geerlingguy.mac.mas"
  when: >
    not (dotmodules_skip_mas_role | default(false) | bool)
    and final_config | dict2items
    | selectattr('key', 'match', '^mas_')
    | list | length > 0

# Run Homebrew installation using direct modules (no sudo required)
- name: Ensure configured Homebrew taps are tapped
  community.general.homebrew_tap:
    tap: "{{ item }}"
    state: present
  loop: "{{ homebrew_taps | default([]) }}"
  when: homebrew_taps is defined and homebrew_taps | length > 0

- name: Ensure configured Homebrew packages are installed
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_packages | default([]) }}"
  when: homebrew_packages is defined and homebrew_packages | length > 0

- name: Install configured Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: yes
  loop: "{{ homebrew_casks | default([]) }}"
  when: homebrew_casks is defined and homebrew_casks | length > 0
